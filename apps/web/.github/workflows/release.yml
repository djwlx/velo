name: Release Web

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Set version from tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package web assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p package
          cp -R dist/. package/
          printf '{"version":"%s"}\n' "$VERSION" > package/version.json
          tar -czf "web-${VERSION}.tar.gz" -C package .
          SHA256=$(sha256sum "web-${VERSION}.tar.gz" | awk '{print $1}')
          printf '{"version":"%s","file":"web-%s.tar.gz","sha256":"%s"}\n' "$VERSION" "$VERSION" "$SHA256" > latest.json

      - name: Commit version update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore: bump version to ${GITHUB_REF_NAME#v}"
          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
          git push origin HEAD:"$DEFAULT_BRANCH"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: false
          files: |
            web-*.tar.gz
            latest.json
